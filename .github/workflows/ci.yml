name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  packages:
    name: Packages
    uses: ./.github/workflows/packages.yml
  lint:
    name: Lint
    runs-on: ubuntu-latest
    # Pinned, unlike the package builds: formatting and clang-tidy findings change between LLVM
    # releases. Bump deliberately, together with the fixes the new version asks for.
    container: fedora:44
    steps:
      - name: Install tools
        run: dnf -y install clang-tools-extra cmake ninja-build rpm-build 'dnf-command(builddep)'
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: dnf -y builddep packaging/blink-capture.spec
      - name: Check formatting
        run: clang-format --dry-run --Werror src/*.cpp src/*.h recorder/*.cpp recorder/*.h
      - name: Configure
        run: cmake -S . -B build -G Ninja
      # Also generates the moc and Wayland protocol sources that clang-tidy needs.
      - name: Build
        run: cmake --build build
      - name: Run clang-tidy
        run: run-clang-tidy -p build -quiet '/(src|recorder)/[^/]*$'
